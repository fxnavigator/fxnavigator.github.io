<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Navigator - Referral Link</title>
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="FX Navigator Referral">
    <meta property="og:description" content="Join FX Navigator Referral Competition">
    <meta property="og:type" content="website">
    
    <!-- Android App Links -->
    <meta name="al:android:url" content="fxnavigator://ref/CODE">
    <meta name="al:android:package" content="sd.elteyab.fxapp">
    <meta name="al:android:app_name" content="FX Navigator">
    
    <!-- iOS Universal Links -->
    <meta name="al:ios:url" content="fxnavigator://ref/CODE">
    <meta name="al:ios:app_store_id" content="YOUR_APP_STORE_ID">
    <meta name="al:ios:app_name" content="FX Navigator">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1E3A5F 0%, #0F172A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 400px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #FFD700;
        }
        
        p {
            color: #B0B0B0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #1E3A5F;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        
        .store-badges {
            margin-top: 30px;
        }
        
        .store-badge {
            height: 50px;
            margin: 5px;
        }
        
        .loading {
            display: none;
            margin-top: 20px;
            color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📊</div>
        <h1>Join FX Navigator</h1>
        <p>Use this referral code to join the competition and earn rewards!</p>
        
        <div class="loading" id="loading">
            Opening FX Navigator...
        </div>
        
        <div class="store-badges">
            <a href="https://play.google.com/store/apps/details?id=sd.elteyab.fxapp" class="store-badge">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play" height="50">
            </a>
            <a href="https://apps.apple.com/app/fx-navigator/idYOUR_APP_ID" class="store-badge">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on App Store" height="50">
            </a>
        </div>
    </div>

    <script>
        // Get referral code from URL
        const path = window.location.pathname;
        const codeMatch = path.match(/\/ref\/([^/]+)/);
        const code = codeMatch ? codeMatch[1] : '';
        
        // Deep link URLs
        const androidDeepLink = `fxnavigator://ref/${code}`;
        const iosDeepLink = `fxnavigator://ref/${code}`;
        const androidStore = 'https://play.google.com/store/apps/details?id=sd.elteyab.fxapp';
        const iosStore = 'https://apps.apple.com/app/fx-navigator/idYOUR_APP_ID';
        
        // Detect platform
        function getPlatform() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            if (/android/i.test(userAgent)) {
                return 'android';
            }
            
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                return 'ios';
            }
            
            return 'web';
        }
        
        // Try to open app
        function openApp() {
            const platform = getPlatform();
            const loading = document.getElementById('loading');
            
            if (platform === 'android') {
                loading.style.display = 'block';
                window.location.href = androidDeepLink;
                
                // Fallback to Play Store after 2 seconds
                setTimeout(() => {
                    window.location.href = androidStore;
                }, 2000);
                
            } else if (platform === 'ios') {
                loading.style.display = 'block';
                window.location.href = iosDeepLink;
                
                // Fallback to App Store after 2 seconds
                setTimeout(() => {
                    window.location.href = iosStore;
                }, 2000);
                
            } else {
                // Desktop - show both store links
                alert('Please open this link on your mobile device to join the competition.');
            }
        }
        
        // Auto-redirect on page load (optional)
        // window.onload = openApp;
    </script>
</body>
</html>
