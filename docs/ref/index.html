<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Join FX Navigator Competition</title>

    <!-- Open Graph -->
    <meta property="og:title" content="FX Navigator Referral Competition">
    <meta property="og:description" content="Join the competition and win $5,000!">
    <meta property="og:type" content="website">

    <!-- Android App Links -->
    <meta name="al:android:url" id="al-android-url">
    <meta name="al:android:package" content="sd.elteyab.fxapp">
    <meta name="al:android:app_name" content="FX Navigator">

    <!-- iOS Universal Links -->
    <meta name="al:ios:url" id="al-ios-url">
    <meta name="al:ios:app_store_id" content="6739077533">
    <meta name="al:ios:app_name" content="FX Navigator">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2744 50%, #0d1f3c 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo-container {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.3);
        }
        .logo-icon { font-size: 56px; }
        h1 {
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
            color: #FFD700;
        }
        .subtitle {
            font-size: 15px;
            color: #8892a4;
            text-align: center;
            margin-bottom: 28px;
        }
        .prize-banner {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            padding: 18px;
            width: 100%;
            margin-bottom: 20px;
            text-align: center;
        }
        .prize-amount {
            font-size: 38px;
            font-weight: 800;
            color: #FFD700;
            line-height: 1;
        }
        .prize-label { font-size: 13px; color: #8892a4; margin-top: 6px; }
        .referral-code {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 14px 20px;
            width: 100%;
            margin-bottom: 22px;
            text-align: center;
        }
        .referral-code-label { font-size: 11px; color: #8892a4; margin-bottom: 6px; }
        .referral-code-value {
            font-size: 24px;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
        }
        .btn {
            width: 100%;
            padding: 16px 28px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #1a1a2e;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin-top: 12px;
        }
        .store-badges {
            display: none;
            gap: 12px;
            width: 100%;
            margin-top: 12px;
        }
        .store-badge { flex: 1; height: 48px; }
        .store-badge img { width: 100%; height: 100%; object-fit: contain; }
        .features { width: 100%; margin-top: 30px; }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .feature-icon {
            width: 38px;
            height: 38px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .feature-text { font-size: 13px; color: #a0aec0; }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #4a5568;
            text-align: center;
        }
        .loading {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
        }
        .loading.active { display: flex; }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 215, 0, 0.2);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #FFD700; font-size: 15px; }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Opening FX Navigator...</div>
    </div>

    <div class="container">
        <div class="logo-container"><span class="logo-icon">📊</span></div>
        <h1>Join the Competition</h1>
        <p class="subtitle">FX Navigator Referral Race</p>

        <div class="prize-banner">
            <div class="prize-amount">$5,000</div>
            <div class="prize-label">Total Prize Pool</div>
        </div>

        <div class="referral-code">
            <div class="referral-code-label">YOUR REFERRAL CODE</div>
            <div class="referral-code-value" id="referral-code">------</div>
        </div>

        <button class="btn btn-primary" id="open-app-btn" onclick="openApp()">
            <span>🚀</span><span>Open FX Navigator</span>
        </button>

        <div class="store-badges" id="store-badges">
            <a href="https://play.google.com/store/apps/details?id=sd.elteyab.fxapp" class="store-badge">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
            </a>
            <a href="https://apps.apple.com/app/fx-navigator/id6739077533" class="store-badge">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="App Store">
            </a>
        </div>

        <button class="btn btn-secondary" id="install-btn" onclick="goToStore()" style="display:none;">
            <span>📱</span><span>Install App First</span>
        </button>

        <div class="features">
            <div class="feature-item"><div class="feature-icon">🏆</div><div class="feature-text">Win up to $1,500 for 1st place</div></div>
            <div class="feature-item"><div class="feature-icon">👥</div><div class="feature-text">Earn 100 points per referral</div></div>
            <div class="feature-item"><div class="feature-icon">📈</div><div class="feature-text">Real-time leaderboard</div></div>
        </div>

        <div class="footer">Competition ends in 30 days. Terms apply.</div>
    </div>

    <script>
        const path = window.location.pathname;
        const codeMatch = path.match(/\/ref\/([^/]+)/);
        const urlParams = new URLSearchParams(window.location.search);
        const referralCode = (codeMatch && codeMatch[1]) || urlParams.get('code') || null;

        const ANDROID_STORE = 'https://play.google.com/store/apps/details?id=sd.elteyab.fxapp';
        const IOS_STORE = 'https://apps.apple.com/app/fx-navigator/id6739077533';

        if (referralCode) {
            document.getElementById('referral-code').textContent = referralCode.toUpperCase();
            document.getElementById('al-android-url').setAttribute('content', 'fxnavigator://ref/' + referralCode);
            document.getElementById('al-ios-url').setAttribute('content', 'fxnavigator://ref/' + referralCode);

            if (urlParams.get('code')) {
                history.replaceState(null, '', '/ref/' + encodeURIComponent(referralCode));
            }
        }

        function getPlatform() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(ua)) return 'android';
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
            return 'web';
        }

        function openApp() {
            const platform = getPlatform();
            if (platform === 'web') { showStoreOptions(); return; }

            document.getElementById('loading').classList.add('active');

            if (platform === 'android') {
                window.location.href = 'fxnavigator://ref/' + referralCode;
                setTimeout(() => { window.location.href = ANDROID_STORE; }, 2500);
            } else {
                window.location.href = 'fxnavigator://ref/' + referralCode;
                setTimeout(() => { window.location.href = IOS_STORE; }, 2500);
            }
        }

        function goToStore() {
            const platform = getPlatform();
            if (platform === 'android') window.location.href = ANDROID_STORE;
            else if (platform === 'ios') window.location.href = IOS_STORE;
            else showStoreOptions();
        }

        function showStoreOptions() {
            document.getElementById('store-badges').style.display = 'flex';
            document.getElementById('install-btn').style.display = 'none';
            document.getElementById('open-app-btn').innerHTML = '<span>📱</span><span>Get the App</span>';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (getPlatform() === 'web') showStoreOptions();
        });
    </script>
</body>
</html>
